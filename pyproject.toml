[project]
name = "recon-controller"
version = "0.1.0"
description = "AI-assisted three-way payment reconciliation engine (gateway <-> bank settlement <-> merchant ledger)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.10.0",
    "numpy>=2.1.0",
    "faker>=30.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require a live Postgres (deselect with -m 'not integration')",
    "scale: the 10,000+ record scale test (slow)",
]

[tool.uv]
default-groups = []
