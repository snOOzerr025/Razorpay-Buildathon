# Alembic configuration for the reconciliation engine.
# DATABASE_ADMIN_URL is the owner-role connection used for schema migrations.
# The application itself connects via DATABASE_URL (least-privilege role).
# Both are set in .env — see .env.example.

[alembic]
# script_location relative to the directory containing alembic.ini
script_location = .

# Use %(here)s to anchor paths to the alembic.ini location
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Read from DATABASE_ADMIN_URL so migrations always run as the DDL-capable owner.
# alembic upgrade head is the only caller that needs this URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
